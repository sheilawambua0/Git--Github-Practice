<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10151d">
  <title>About — Hello, world!</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; color: #f5f7fa; background: #10151d; background-image: radial-gradient(ellipse at 18% 20%, #d4a45620, transparent 38%), radial-gradient(ellipse at 82% 78%, #79a8b522, transparent 42%); }
    main { width: min(900px, calc(100% - 40px)); padding: clamp(34px, 8vw, 88px); border: 1px solid #ffffff18; border-radius: 28px; background: linear-gradient(145deg, #ffffff0b, #ffffff04); box-shadow: 0 32px 100px #0005; }
    .eyebrow { display: inline-flex; align-items: center; gap: 10px; color: #dcb975; font-size: 12px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #dcb975; box-shadow: 0 0 14px #dcb975; }
    h1 { margin: 28px 0 18px; font-size: clamp(48px, 9vw, 88px); line-height: .98; letter-spacing: -.07em; font-weight: 650; }
    h1 span { color: #dcb975; }
    p { max-width: 560px; margin: 0; color: #aab3bf; font-size: clamp(16px, 2vw, 19px); line-height: 1.75; }
    .rule { width: 54px; height: 2px; margin-top: 40px; background: #dcb975; }
    nav { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 30px; }
    nav a { color: #dcb975; font-size: 14px; font-weight: 600; text-decoration: none; }
    nav a:hover, nav a:focus-visible { color: #f5d79d; text-decoration: underline; text-underline-offset: 5px; }
    @media (max-width: 520px) { main { border-radius: 20px; } }
    @media (prefers-reduced-motion: no-preference) { main { animation: arrive .8s ease-out both; } @keyframes arrive { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow"><span class="dot" aria-hidden="true"></span>About this site</div>
    <h1>A little<br><span>about us.</span></h1>
    <p>This is a place for sharing ideas, learning, and exploring what’s possible. We’re glad you stopped by.</p>
    <div class="rule" aria-hidden="true"></div>
    <nav aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="contact.html">Contact</a>
    </nav>
  </main>
</body>
</html>
