<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10151d">
  <title>Hello, world!</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; display: grid; place-items: center; overflow: hidden;
      color: #f5f7fa; background: #10151d;
      background-image: radial-gradient(ellipse at 18% 20%, #d4a45620, transparent 38%), radial-gradient(ellipse at 82% 78%, #79a8b522, transparent 42%);
    }
    main { width: min(900px, calc(100% - 40px)); padding: clamp(34px, 8vw, 88px); border: 1px solid #ffffff18; border-radius: 28px; background: linear-gradient(145deg, #ffffff0b, #ffffff04); box-shadow: 0 32px 100px #0005; position: relative; }
    .eyebrow { display: inline-flex; align-items: center; gap: 10px; color: #dcb975; font-size: 12px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #dcb975; box-shadow: 0 0 14px #dcb975; }
    h1 { margin: 28px 0 18px; max-width: 760px; font-size: clamp(56px, 11vw, 112px); line-height: .96; letter-spacing: -.075em; font-weight: 650; }
    h1 span { color: #dcb975; }
    p { max-width: 440px; margin: 0; color: #aab3bf; font-size: clamp(16px, 2vw, 19px); line-height: 1.75; }
    .rule { width: 54px; height: 2px; margin-top: 40px; background: #dcb975; }
    footer { margin-top: 24px; color: #687380; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
    @media (max-width: 520px) { main { border-radius: 20px; } }
    @media (prefers-reduced-motion: no-preference) { main { animation: arrive .8s ease-out both; } @keyframes arrive { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow"><span class="dot" aria-hidden="true"></span>A little beginning</div>
    <h1>Hello,<br><span>world!</span></h1>
    <p>A fresh page, a blank canvas, and a whole world of possibilities. Glad you’re here.</p>
    <div class="rule" aria-hidden="true"></div>
    <footer>Made for curious minds</footer>
  </main>
</body>
</html>
